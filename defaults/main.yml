---
# Override this if your distro codename isn't available in InfluxData repos
# (e.g., set to 'stable' for Debian trixie)
telegraf_repo_codename: "{{ ansible_facts['lsb']['codename'] }}"

telegraf_agent_debug: "false"
telegraf_agent_hostname: "{{ inventory_hostname }}"
telegraf_agent_interval: "10s"
telegraf_agent_flush_interval: "10s"
telegraf_agent_flush_jitter: "0s"
telegraf_agent_round_interval: "true"

telegraf_autoping: false
telegraf_remote_mounts_check: false
telegraf_enabled: false

telegraf_install_latest: false

telegraf_tags: {}
# telegraf_tags:
#   foo: bar
#   fizz: buzz

telegraf_outputs: {}
# telegraf_outputs:
#   influxdb:
#     urls: ["http://localhost:8086"]
#     database: '"telegraf"'
#     precision: '"s"'
#     timeout: '"30s"'
#     username: '"telegraf"'
#     password: '"metricsmetricsmetricsmetrics"'

telegraf_inputs_disk_options:
  ignore_fs:
    - aufs
    - devfs
    - devtmpfs
    - iso9660
    - overlay
    - squashfs
    - tmpfs
  interval: '"60s"'

telegraf_inputs:
  cpu:
    percpu: "true"
    totalcpu: "true"
    drop: ["cpu_time"]
  disk: {}
  mem: {}
  swap: {}
  system: {}

telegraf_processors: {}
